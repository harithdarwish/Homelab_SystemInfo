name: Run Ansible Playbook

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Cloudflare Tunnel CLI
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH to use Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "Host ssh.harithwish.com" >> ~/.ssh/config
          echo "  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h" >> ~/.ssh/config
          echo "  ControlMaster auto" >> ~/.ssh/config
          echo "  ControlPath ~/.ssh/ctl-%r@%h:%p" >> ~/.ssh/config
          echo "  ControlPersist 10m" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run Playbook and Capture Real-Time Output
        run: |
          mkdir -p /tmp/reports
          {
            echo "=========================================="
            echo "  PROXMOX VM SYSTEM HEALTH REPORT"
            echo "  Executed At: $(date)"
            echo "=========================================="
            echo ""
            ansible-playbook -i inventory-tunnelcloudflare.ini playbook-SystemInfo1.yaml --limit ubuntu1_SytemInfo_sshGithub
          } | tee /tmp/reports/system_report.txt

      - name: Upload System Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-health-report
          path: /tmp/reports/system_report.txt

  result:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Successful Deployment
        run: echo "Deployment and report generation completed successfully!"
