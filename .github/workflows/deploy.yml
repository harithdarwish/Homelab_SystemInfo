
name: Run Ansible Playbook

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Cloudflare Tunnel CLI
        run: |
          curl -fL --output cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH to use Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host ssh.harithwish.com
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            ControlMaster auto
            ControlPath ~/.ssh/ctl-%r@%h:%p
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config

      - name: Run Ansible Playbook
        id: ansible
        continue-on-error: true
        uses: dawidd6/action-ansible-playbook@v2
        env:
          ANSIBLE_LOG_PATH: ${{ github.workspace }}/ansible_output.txt
          ANSIBLE_NOCOLOR: "1"
        with:
          playbook: playbook-SystemInfo1.yaml
          directory: ./
          options: -i inventory-tunnelcloudflare.ini --limit ubuntu1_SytemInfo_sshGithub

      - name: Check Ansible Output
        if: always()
        run: |
          if [ -f ansible_output.txt ]; then
            echo "Ansible log file found."
            ls -lh ansible_output.txt
          else
            echo "Ansible log file was not created."
            echo "The Ansible action may not expose its log file to this runner."
          fi

      - name: Upload Ansible Output
        if: always() && hashFiles('ansible_output.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ansible-system-output
          path: ansible_output.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail Workflow if Ansible Failed
        if: steps.ansible.outcome == 'failure'
        run: |
          echo "Ansible playbook failed. Check the workflow logs."
          exit 1

  result:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Successful Deployment
        run: echo "Ansible execution completed successfully!"

