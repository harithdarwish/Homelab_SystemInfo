
name: Run Ansible Playbook

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Cloudflare Tunnel CLI
        run: |
          curl -fL --output cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH to use Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host ssh.harithwish.com
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            ControlMaster auto
            ControlPath ~/.ssh/ctl-%r@%h:%p
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare Report Directory
        run: mkdir -p reports

      - name: Run Ansible Playbook and Capture Output
        id: ansible
        continue-on-error: true
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: playbook-SystemInfo1.yaml
          directory: ./
          options: -i inventory-tunnelcloudflare.ini --limit ubuntu1_SytemInfo_sshGithub

      - name: Generate Report from Ansible Output
        if: always()
        env:
          JOB_STATUS: ${{ steps.ansible.outcome }}
          RUN_DATE: ${{ github.run_started_at }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p reports

          cat > reports/system_report.txt <<EOF
          ==========================================
                 PROXMOX VM SYSTEM HEALTH REPORT
          ==========================================
          Workflow Run: ${RUN_NUMBER}
          Executed At: ${RUN_DATE}
          Target: ubuntu1_SytemInfo_sshGithub
          SSH Endpoint: ssh.harithwish.com
          Ansible Step Status: ${JOB_STATUS}

          NOTE:
          This file records the workflow run metadata.
          The actual Ansible output is available in the
          GitHub Actions job logs.

          To view the real system metrics:
          1. Open this workflow run in GitHub Actions.
          2. Expand "Run Ansible Playbook and Capture Output".
          3. Review the Ansible task results and play recap.
          ==========================================
          EOF

          cat > reports/system_report.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>System Health Report</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 850px;
                margin: 35px auto;
                padding: 20px;
                color: #222;
              }
              h1 { font-size: 25px; }
              .status { padding: 12px; background: #eee; }
              pre {
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                line-height: 1.6;
              }
              button { padding: 10px 18px; cursor: pointer; }
              @media print {
                button { display: none; }
                body { margin: 0; max-width: none; }
              }
            </style>
          </head>
          <body>
            <h1>Proxmox VM System Health Report</h1>
            <p><strong>Workflow run:</strong> ${RUN_NUMBER}</p>
            <p><strong>Executed at:</strong> ${RUN_DATE}</p>
            <p><strong>Target:</strong> ubuntu1_SytemInfo_sshGithub</p>
            <p class="status"><strong>Ansible step status:</strong> ${JOB_STATUS}</p>
            <p>
              The actual system metrics are displayed in the
              GitHub Actions job logs. This report contains run metadata,
              not the full Ansible output.
            </p>
            <button onclick="window.print()">Print / Save as PDF</button>
          </body>
          </html>
          EOF

      - name: Upload System Health Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-health-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail Workflow if Ansible Failed
        if: steps.ansible.outcome == 'failure'
        run: |
          echo "Ansible playbook failed. Check the Ansible step logs."
          exit 1

  result:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Successful Deployment
        run: echo "Deployment and report generation completed successfully!"

