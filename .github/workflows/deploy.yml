name: Run Ansible Playbook

on:
  workflow_dispatch:

jobs:
  # Job 1: Runs your SSH setup, tunnel, and Ansible playbook
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Cloudflare Tunnel CLI
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH to use Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "Host ssh.harithwish.com" >> ~/.ssh/config
          echo "  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h" >> ~/.ssh/config
          echo "  ControlMaster auto" >> ~/.ssh/config
          echo "  ControlPath ~/.ssh/ctl-%r@%h:%p" >> ~/.ssh/config
          echo "  ControlPersist 10m" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run Ansible Playbook
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: playbook-SystemInfo1.yaml
          directory: ./
          options: -i inventory-tunnelcloudflare.ini --limit ubuntu1_SytemInfo_sshGithub

  # Job 2: Runs *after* deploy finishes, handling reports or post-checks
  result:
    needs: deploy  # This links 'result' to wait for 'deploy', creating the visual chain!
    runs-on: ubuntu-latest
    steps:
      - name: Generate System Report Summary
        run: |
          echo "=== Ansible Execution Status ===" > /tmp/system_report.txt
          echo "Deployment job completed successfully at $(date)" >> /tmp/system_port.txt

      - name: Upload System Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-health-report
          path: /tmp/system_report.txt
