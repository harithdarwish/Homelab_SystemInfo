
name: Run Ansible Playbook

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Report Directory
        run: mkdir -p reports

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Cloudflare Tunnel CLI
        run: |
          curl -fL --output cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH to use Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host ssh.harithwish.com
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            ControlMaster auto
            ControlPath ~/.ssh/ctl-%r@%h:%p
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config

      - name: Run Ansible Playbook and Capture Output
        id: ansible
        continue-on-error: true
        uses: dawidd6/action-ansible-playbook@v2
        env:
          ANSIBLE_LOG_PATH: reports/ansible_output.txt
          ANSIBLE_NOCOLOR: "1"
        with:
          playbook: playbook-SystemInfo1.yaml
          directory: ./
          options: -i inventory-tunnelcloudflare.ini --limit ubuntu1_SytemInfo_sshGithub

      - name: Generate System Health Reports
        if: always()
        env:
          ANSIBLE_STATUS: ${{ steps.ansible.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from html import escape
          import os

          report_dir = Path("reports")
          report_dir.mkdir(exist_ok=True)

          output_file = report_dir / "ansible_output.txt"
          report_file = report_dir / "system_report.txt"
          html_file = report_dir / "system_report.html"

          status = os.environ.get("ANSIBLE_STATUS", "unknown").upper()
          run_number = os.environ.get("RUN_NUMBER", "unknown")
          timestamp = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M:%S UTC"
          )

          if output_file.exists():
              actual_output = output_file.read_text(
                  encoding="utf-8", errors="replace"
              )
          else:
              actual_output = (
                  "Ansible output log was not found.\n"
                  "Check the Ansible action logs for details.\n"
              )

          report = f"""==================================================
             PROXMOX VM SYSTEM HEALTH REPORT
          ==================================================
          Workflow Run: {run_number}
          Generated: {timestamp}
          Target Group: ubuntu1_SytemInfo_sshGithub
          SSH Endpoint: ssh.harithwish.com
          Ansible Action Status: {status}

          ==================================================
                    ACTUAL ANSIBLE OUTPUT
          ==================================================

          {actual_output}
          """

          report_file.write_text(report, encoding="utf-8")

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>System Health Report</title>
            <style>
              body {{
                font-family: Arial, sans-serif;
                max-width: 1000px;
                margin: 30px auto;
                padding: 20px;
                color: #222;
              }}
              h1 {{ font-size: 25px; }}
              .status {{
                padding: 12px;
                background: #eee;
                border-radius: 5px;
              }}
              pre {{
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                line-height: 1.5;
                background: #f5f5f5;
                border: 1px solid #ddd;
                padding: 18px;
                font-size: 13px;
              }}
              button {{
                padding: 10px 18px;
                cursor: pointer;
                margin-bottom: 16px;
              }}
              @media print {{
                button {{ display: none; }}
                body {{ margin: 0; max-width: none; }}
                pre {{ background: white; border: none; padding: 0; }}
              }}
            </style>
          </head>
          <body>
            <h1>Proxmox VM System Health Report</h1>
            <p><strong>Workflow Run:</strong> {escape(run_number)}</p>
            <p><strong>Generated:</strong> {escape(timestamp)}</p>
            <p><strong>Target:</strong> ubuntu1_SytemInfo_sshGithub</p>
            <p class="status"><strong>Ansible Action Status:</strong>
              {escape(status)}</p>
            <button onclick="window.print()">Print / Save as PDF</button>
            <h2>Actual Ansible Output</h2>
            <pre>{escape(actual_output)}</pre>
          </body>
          </html>
          """

          html_file.write_text(html, encoding="utf-8")
          print(f"Text report created: {report_file}")
          print(f"HTML report created: {html_file}")
          print(f"Ansible output log found: {output_file.exists()}")
          PY

      - name: Upload System Health Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-health-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail Workflow if Ansible Failed
        if: steps.ansible.outcome == 'failure'
        run: |
          echo "Ansible playbook failed. Check the captured output."
          exit 1

  result:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Successful Deployment
        run: echo "Deployment and report generation completed successfully!"

