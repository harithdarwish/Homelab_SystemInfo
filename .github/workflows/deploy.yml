name: Run Ansible Playbook & Deploy Report

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Report Directory
        run: mkdir -p reports

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up Cloudflare Tunnel CLI
        run: |
          curl -fL --output cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH to use Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host ssh.harithwish.com
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            ControlMaster auto
            ControlPath ~/.ssh/ctl-%r@%h:%p
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config

      - name: Run Ansible Playbook and Capture Output
        id: ansible
        continue-on-error: true
        uses: dawidd6/action-ansible-playbook@v2
        env:
          ANSIBLE_LOG_PATH: reports/ansible_output.txt
          ANSIBLE_NOCOLOR: "1"
        with:
          playbook: playbook-SystemInfo1.yaml
          directory: ./
          options: -i inventory-tunnelcloudflare.ini --limit ubuntu1_SytemInfo_sshGithub

      - name: Generate System Health Reports
        if: always()
        env:
          ANSIBLE_STATUS: ${{ steps.ansible.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from html import escape
          import os

          report_dir = Path("reports")
          report_dir.mkdir(exist_ok=True)
          output_file = report_dir / "ansible_output.txt"
          report_file = report_dir / "system_report.txt"
          html_file = report_dir / "system_report.html"

          status = os.environ.get("ANSIBLE_STATUS", "unknown").upper()
          run_number = os.environ.get("RUN_NUMBER", "unknown")
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          if output_file.exists():
              actual_output = output_file.read_text(encoding="utf-8", errors="replace")
          else:
              actual_output = "Ansible output log was not found.\nCheck the Ansible action logs for details.\n"

          report = f"""==================================================
             PROXMOX VM SYSTEM HEALTH REPORT
          ==================================================
          Workflow Run: {run_number}
          Generated: {timestamp}
          Target Group: ubuntu1_SytemInfo_sshGithub
          SSH Endpoint: ssh.harithwish.com
          Ansible Action Status: {status}
          ==================================================

                    ACTUAL ANSIBLE OUTPUT
          ==================================================
          {actual_output}
          """
          report_file.write_text(report, encoding="utf-8")

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Proxmox VM System Health Report</title>
            <style>
              body {{ font-family: monospace; background-color: #1e1e1e; color: #d4d4d4; padding: 20px; max-width: 1000px; margin: 30px auto; }}
              h1 {{ font-size: 22px; color: #4ec9b0; }}
              .status {{ padding: 10px; background: #252526; border-radius: 5px; border: 1px solid #333; }}
              pre {{ white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; background: #252526; border: 1px solid #333; padding: 15px; font-size: 13px; color: #ce9178; }}
              button {{ padding: 8px 16px; cursor: pointer; margin-bottom: 15px; background: #0e639c; color: white; border: none; border-radius: 4px; }}
              button:hover {{ background: #1177bb; }}
              @media print {{ button {{ display: none; }} body {{ background: white; color: black; }} pre {{ background: white; color: black; border: none; }} }}
            </style>
          </head>
          <body>
            <h1>Proxmox VM System Health Report</h1>
            <p><strong>Workflow Run:</strong> {escape(run_number)}</p>
            <p><strong>Generated:</strong> {escape(timestamp)}</p>
            <p><strong>Target:</strong> ubuntu1_SytemInfo_sshGithub</p>
            <p class="status"><strong>Ansible Action Status:</strong> {escape(status)}</p>
            <button onclick="window.print()">Print / Save as PDF</button>
            <h2>Actual Ansible Output</h2>
            <pre>{escape(actual_output)}</pre>
          </body>
          </html>
          """
          html_file.write_text(html, encoding="utf-8")
          PY

      - name: Prepare Public Web Files for GitHub Pages
        if: always()
        run: |
          mkdir -p public
          # Copy generated html report to root index.html so it loads instantly at the URL
          cp reports/system_report.html public/index.html
          cp reports/system_report.txt public/system_report.txt

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Upload Artifacts Archive (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: system-health-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail Workflow if Ansible Failed
        if: steps.ansible.outcome == 'failure'
        run: |
          echo "Ansible playbook failed. Check the captured output."
          exit 1

  result:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Successful Deployment
        run: echo "Deployment and report generation completed successfully!"
